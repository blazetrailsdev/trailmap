<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept C · Soil (dark)</title>
<link rel="stylesheet" href="palette.css">
<script src="data.js"></script><script src="common.js"></script>
<style>
:root {
  --bg: #1d1510; --surface: #271c15; --surface-2: #31241b; --line: #45342a;
  --ink: #f3e9da; --ink-2: #c7b39c; --ink-3: #a08a75;
  --terracotta: #de7a56; --mustard: #e6bd4a; --forest: #6fa57f; --clay: #b9a088;
  --st-ci: #c99a5b; --st-ready: #93c07f; --st-drafting: #b9a088; --st-self: #e6bd4a; --st-ringo: #de7a56; --st-merged: #6fa57f;
  --shadow: 0 8px 28px rgba(0,0,0,.35);
}
body { background: radial-gradient(1200px 500px at 80% -10%, #3a2618 0%, transparent 60%), var(--bg); min-height: 100vh; }
.topbar { background: transparent; }
.layout { display: grid; grid-template-columns: 420px 1fr; gap: 22px; }
.rail { display: flex; flex-direction: column; gap: 16px; }
.group h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--c); margin: 0 0 6px; display: flex; gap: 8px; align-items: center; }
.group h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.item { display: grid; grid-template-columns: 8px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer; }
.item:hover { background: var(--surface); }
.item.sel { background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); }
.item .bead { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.item b { font-weight: 500; font-size: 13.5px; display: block; }
.item small { color: var(--ink-3); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 24px; box-shadow: var(--shadow); align-self: start; position: sticky; top: 20px; }
.step .lbl { font-size: 11px; white-space: normal; line-height: 1.2; max-width: 70px; }
.panel h1 { font-family: var(--display); font-size: 26px; margin: 10px 0 4px; }
.panel .log { max-height: 360px; background: #1f1712; }
.panel .composer { background: var(--surface-2); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0; }
.t { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.t small { color: var(--ink-3); display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.t b { font-family: var(--display); font-size: 20px; }
.idle { text-align: center; padding: 48px 20px 56px; color: var(--ink-2); }
.funnel { display: flex; gap: 6px; margin: 26px auto 0; max-width: 560px; height: 160px; align-items: end; }
.funnel > div { height: 100%; display: flex; flex-direction: column; justify-content: end; gap: 6px; flex: 1; }
.funnel i { display: block; background: var(--c); border-radius: 8px 8px 3px 3px; }
.funnel span { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
.step.now .node { color: var(--bg); }
.item { color: inherit; text-decoration: none; }
.item:focus-visible { outline: 2px solid var(--terracotta); outline-offset: -2px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const sel = SESSIONS.find((s) => s.id === openId);
const panel = sel ? `
  <div class="panel stage-${sel.stage}">
    <div style="display:flex;justify-content:space-between">${stageChip(sel.stage)}<span class="muted">${sel.age} ago</span></div>
    <h1>${sel.story}</h1>
    <div class="muted">${prLink(sel)} · <span class="mono">${sel.branch}</span></div>
    <div style="margin-top:18px">${stepper(sel.stage)}</div>
    <div class="tiles">
      <div class="t"><small>Findings</small><b>${sel.ringo ? `${sel.ringo.done} / ${sel.ringo.total}` : "—"}</b></div>
      <div class="t"><small>Diff</small><b>${sel.loc} LOC</b></div>
      <div class="t"><small>Checks</small><b>${sel.ci ? `${sel.ci.pass} / ${sel.ci.pass + sel.ci.fail + sel.ci.run}` : "—"}</b></div>
    </div>
    ${renderLog(sel)}
    ${renderComposer(sel)}
  </div>` : `
  <div class="panel idle">
    <h1 style="color:var(--ink)">Pick a session</h1>
    <p>${SESSIONS.length} sessions across ${STAGES.length} stages. Select one to read its log and send it a message.</p>
    <div class="funnel">${(() => { const counts = STAGES.map((s) => SESSIONS.filter((x) => x.stage === s.key).length), max = Math.max(...counts); return STAGES.map((s, i) => `<div class="stage-${s.key}"><i style="height:${Math.round((120 * counts[i]) / max)}px"></i><span>${s.short} · ${counts[i]}</span></div>`).join(""); })()}</div>
  </div>`;
document.getElementById("app").innerHTML = topbar() + `
<main class="page">
  <div class="layout">
    <nav class="rail">${STAGES.map((st) => `
      <div class="group stage-${st.key}"><h2>${st.label}</h2>
      ${SESSIONS.filter((s) => s.stage === st.key).map((s) => `
        <a class="item stage-${s.stage} ${s.id === openId ? "sel" : ""}" href="?open=${s.id}"${s.id === openId ? ' aria-current="true"' : ""}>
          <span class="bead"></span><div><b>${s.story}</b><small>${s.pr ? `${s.repo}#${s.pr}` : "no PR"} · ${s.note}</small></div><small>${s.age}</small>
        </a>`).join("")}</div>`).join("")}
    </nav>
    ${panel}
  </div>
</main>`;
</script>
</body>
</html>
