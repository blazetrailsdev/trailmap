<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept B · Fleet stepper</title>
<link rel="stylesheet" href="palette.css">
<script src="data.js"></script><script src="common.js"></script>
<style>
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 500; }
.pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 3px color-mix(in srgb, var(--forest) 20%, transparent); }
.pill.bad .led { background: var(--terracotta); box-shadow: 0 0 0 3px color-mix(in srgb, var(--terracotta) 20%, transparent); }
.pill.warn .led { background: var(--mustard); }
.status .grow { flex: 1; }
.btn.danger { border-color: var(--terracotta); color: var(--terracotta); }
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; align-items: stretch; }
.panel { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.panel h2 small { font-weight: 400; color: var(--ink-3); }
.ask:last-child { margin-bottom: 0; }
.ask { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--mustard-soft); margin-bottom: 8px; align-items: center; }
.ask q { display: block; color: var(--ink); font-size: 13px; margin-top: 2px; }
.ask q::before, .ask q::after { content: ""; }
.fixer { display: flex; gap: 12px; align-items: center; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--terracotta-soft); }
.usage-row { display: grid; grid-template-columns: 70px 1fr 80px; gap: 10px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.meter { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.loop label { font-size: 11.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.loop input[type=number] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 100%; }
.toggle { width: 38px; height: 22px; border-radius: 99px; background: var(--forest); position: relative; margin-top: 3px; }
.toggle::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input, .inline select { font: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.inline input { flex: 1; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; }
.section-head { margin-top: 28px; }
.stagebar { display: flex; gap: 3px; margin-left: auto; }
.stagebar i { width: 18px; height: 6px; border-radius: 3px; background: var(--c); }
.step .lbl { display: none; }
.step:not(:last-child)::after { margin: 0 6px; }
.stage-header { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr) 110px; gap: 24px; padding: 8px 20px 10px 25px; position: sticky; top: 0; z-index: 3; background: var(--bg); }
.stepper.header .step::after { visibility: hidden; }
.stepper.header .node { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: transparent; color: var(--c); }
.stepper.header .hl { font-size: 11px; font-weight: 600; color: var(--c); line-height: 1.2; white-space: normal; max-width: 80px; }
.section-head h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.filters { display: flex; gap: 8px; margin-bottom: 14px; }
.sessions { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; border-left: 5px solid var(--c); }
.card-main { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr) 110px; gap: 24px; align-items: center; padding: 16px 20px; cursor: pointer; }
.card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; }
.stories { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.story { font-size: 13px; color: var(--ink-2); text-decoration: none; border-bottom: 1px dotted var(--clay); }
.story:hover { color: var(--terracotta); border-color: var(--terracotta); }
.story.lead { font-size: 15px; font-weight: 600; color: var(--ink); flex: 0 0 100%; border: 0; word-break: break-word; }
.batch { font-size: 11px; font-weight: 600; color: var(--soil); background: var(--soil-soft); padding: 1px 7px; border-radius: 99px; }
.pr-link { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--forest); text-decoration: none; background: var(--forest-soft); padding: 2px 8px; border-radius: 6px; }
.pr-link:hover { background: var(--forest); color: #fff; }
.pr-link.none { color: var(--ink-3); background: var(--surface-2); }
.note { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; }
.right { text-align: right; color: var(--ink-3); font-size: 12px; }
.caret { display: inline-block; transition: transform .2s; margin-left: 6px; }
.card.open .caret { transform: rotate(90deg); }
.detail { display: none; border-top: 1px solid var(--line); padding: 16px 20px 20px; background: linear-gradient(var(--cream), var(--surface)); }
.card.open .detail { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
.side h4, .detail h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 16px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; }

@media (max-width: 700px) {
  .topbar { padding: 12px 16px; gap: 12px; }
  .topbar .nav, .topbar .search { display: none; }
  .page { padding: 18px 16px 40px; }
  .page-head h1 { font-size: 26px; }
  .status { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding: 0 16px 4px; }
  .status .pill { flex: none; }
  .status .grow { display: none; }
  .status .btn { flex: none; }
  .stage-header { display: none; }
  .panels { grid-template-columns: 1fr; gap: 8px; margin-inline: -16px; }
  .panel { border-radius: 0; border-inline: 0; box-shadow: none; }
  .sessions { margin-inline: -16px; gap: 8px; }
  .card { border-radius: 0; border-right: 0; box-shadow: none; }
  .loop { grid-template-columns: 1fr 1fr; }
  .inline { flex-wrap: wrap; }
  .inline input { min-width: 0; flex-basis: 100%; }
  .card-main { grid-template-columns: 1fr auto; gap: 12px; padding: 14px; }
  .card-main .stepper { grid-column: 1 / -1; grid-row: 2; }
  .step .lbl { display: none; }
  .card-main .stepper { min-width: 0; }
  .step { min-width: 0; }
  .step:not(:last-child)::after { min-width: 4px; }
  .step:not(:last-child)::after { margin: 0 4px; }
  .card h3 { font-size: 14px; word-break: break-word; }
  .card.open .detail { grid-template-columns: 1fr; padding: 14px; }
  .log-row { grid-template-columns: 52px 18px 1fr; padding-inline: 10px; }
  .log-row .tool-call { word-break: break-all; }
}

.search-btn { display: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); place-items: center; }
.cmdk-scrim { position: fixed; inset: 0; background: rgba(43,33,26,.32); backdrop-filter: blur(2px); z-index: 20; }
.cmdk { position: fixed; top: 96px; left: 50%; translate: -50% 0; width: 680px; max-height: 70vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 24px 60px rgba(43,33,26,.28); z-index: 21; overflow: hidden; }
.cmdk-input { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cmdk-input svg { color: var(--terracotta); flex: none; }
.cmdk-input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; color: var(--ink); }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--surface-2); }
.cmdk-scopes { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.cmdk-scopes .chip.on { background: var(--soil); color: var(--cream); }
.cmdk-body { overflow-y: auto; padding: 6px 8px 10px; }
.cmdk-group { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 12px 10px 6px; }
.cmdk-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.cmdk-item.on { background: color-mix(in srgb, var(--terracotta) 12%, var(--surface)); box-shadow: inset 3px 0 0 var(--terracotta); }
.cmdk-item .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--clay)) 18%, var(--surface)); color: var(--c, var(--soil)); }
.cmdk-item b { font-weight: 600; font-size: 13.5px; display: block; }
.cmdk-item mark { background: var(--mustard-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.cmdk-item small { color: var(--ink-3); font-size: 12px; }
.cmdk-item .right { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.cmdk-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); background: var(--surface-2); }
@media (max-width: 700px) {
  .search-btn { display: grid; }
  .cmdk { inset: 0; top: 0; translate: none; left: 0; width: auto; max-height: none; border-radius: 0; border: 0; }
  .cmdk-input { padding: 12px 16px; }
  .cmdk-input .kbd { display: none; }
  .cmdk-input .cancel { color: var(--terracotta); font-weight: 600; }
  .cmdk-foot { display: none; }
  .cmdk-item { padding: 10px; }
  .cmdk-item .right .kbd, .cmdk-item .right .chip { display: none; }
}
@media (min-width: 701px) { .cmdk-input .cancel { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const REPOS = ["trails", "trailmap", "tasks"];
const storyList = (s) => s.stories || [s.story];
const side = (s) => `
  <div class="side">
    <h4>Session</h4>
    <dl class="kv">
      <dt>Story</dt><dd class="mono">${s.story}</dd>
      <dt>RFC</dt><dd>${s.rfc}</dd>
      <dt>PR</dt><dd>${prLink(s)} <span class="chip">draft</span></dd>
      <dt>Package</dt><dd>${s.pkg}</dd>
      <dt>Diff</dt><dd>${s.loc} / 700 LOC</dd>
    </dl>
    <h4>Reviewer convergence</h4>
    <div class="bar"><i style="width:60%;background:var(--forest)"></i><i style="width:20%;background:var(--terracotta)"></i></div>
    <p class="muted" style="font-size:12px;margin:6px 0 16px">3 converged · 1 in progress · 1 open</p>
    <div style="display:flex;gap:8px"><button class="btn">Open pane</button><button class="btn">View PR</button></div>
  </div>`;
document.getElementById("app").innerHTML = topbar() + `
<main class="page">
  <div class="page-head">
    <div><h1>Fleet</h1><p>Open PRs, panes, spawns and CI, live from ringo · ${SESSIONS.filter((s) => s.stage !== "merged").length} sessions in flight</p></div>
  </div>
  <div class="status">
    <span class="pill"><span class="led"></span>events</span>
    <span class="pill"><span class="led"></span>tmux</span>
    <span class="pill bad"><span class="led"></span>main CI · AR MariaDB (2/3)</span>
    <span class="pill"><span class="led"></span>usage scraper ⟳</span>
    <span class="pill"><span class="led"></span>claude · 7 live</span>
    <span class="pill warn"><span class="led"></span>codex · 2 live</span>
    <span class="grow"></span>
    <button class="btn danger">Pause all</button>
  </div>
  <div class="panels">
      <div class="panel">
        <h2>Agents waiting on you <small>2 questions</small></h2>
        <div class="ask"><div><span class="mono">zeitwerk-eager-load-namespace</span><q>MariaDB shard 2 red twice on an unrelated test. Rerun, or file a flake?</q></div><button class="btn">Reply</button></div>
        <div class="ask"><div><span class="mono">actionmailer-preview-interceptors</span><q>Finding 5 asks for a scoped skip. OK to add, or converge?</q></div><button class="btn">Reply</button></div>
      </div>
      <div class="panel">
        <h2>Usage <small>resets in 2h 14m</small></h2>
        <div class="usage-row"><span>Claude</span><div class="meter"><i style="width:62%;background:var(--forest)"></i></div><span class="muted">62% · week</span></div>
        <div class="usage-row"><span>Session</span><div class="meter"><i style="width:81%;background:var(--mustard)"></i></div><span class="muted">81% · 5h</span></div>
        <div class="usage-row" style="margin:0"><span>Codex</span><div class="meter"><i style="width:34%;background:var(--clay)"></i></div><span class="muted">34% · week</span></div>
      </div>
      <div class="panel">
        <h2>CI fixer <small>main is red</small></h2>
        <div class="fixer"><span class="chip stage stage-ringo"><span class="dot"></span>fixing</span><span>Worker on <span class="mono">ar-mariadb-shard-flake-3c1e</span> · spawn loop paused · 12m</span></div>
      </div>
      <div class="panel">
        <h2>Loop <small>last spawn 6m ago · next in 4m</small></h2>
        <div class="loop">
          <label>Live cap <span class="muted">7 now</span><input type="number" value="8"></label>
          <label>Queue cap <span class="muted">3 open</span><input type="number" value="4"></label>
          <label>Interval (min)<span>&nbsp;</span><input type="number" value="10"></label>
          <label>Bundle<span>&nbsp;</span><span class="toggle"></span></label>
        </div>
      </div>
    <div class="panel"><h2>Broadcast to agents <small>typed into each pane</small></h2>
      <div class="inline"><input placeholder="e.g. main is red, rebase before you push again"><button class="btn">all</button><button class="btn">CI red</button></div></div>
    <div class="panel"><h2>Manual spawn <small><a href="#">poke 1 stalled agent</a></small></h2>
      <div class="inline"><select><option>trails</option><option>trailmap</option><option>tasks</option></select><input placeholder="Enter a task for Claude…"><button class="btn primary" style="background:var(--forest);border-color:var(--forest)">Spawn</button></div></div>
  </div>
  ${REPOS.map((repo) => { const list = SESSIONS.filter((s) => s.repo === repo).sort((a, b) => stageIdx(a.stage) - stageIdx(b.stage)); return `
  <div class="section-head"><h2>${repo}</h2><span class="muted">${list.length} sessions · ${list.filter((s) => s.stage !== "merged").length} in flight</span><span class="stagebar">${list.map((s) => `<i class="stage-${s.stage}"></i>`).join("")}</span></div>
  <div class="stage-header"><span></span>${stageHeader()}<span></span></div>
  <section class="sessions">${list.map((s) => `
    <article class="card stage-${s.stage} ${openId === s.id ? "open" : ""}">
      <div class="card-main">
        <div>
          <div class="meta" style="margin-bottom:6px">${stageChip(s.stage)} ${s.pr ? `<a class="pr-link" href="#" onclick="event.stopPropagation()">↗ ${s.repo}#${s.pr}</a>` : `<span class="pr-link none">no PR yet</span>`} <span>${s.pkg}</span></div>
          <div class="stories">${storyList(s).map((id, i) => `<a href="#" class="story${i === 0 ? " lead" : ""}" onclick="event.stopPropagation()">${id}</a>`).join("")}${storyList(s).length > 1 ? `<span class="batch">bundle · ${storyList(s).length} stories</span>` : ""}</div>
          <div class="note">${s.note}</div>
        </div>
        ${stepper(s.stage)}
        <div class="right">${s.age} ago<span class="caret">›</span><br>${s.loc} LOC</div>
      </div>
      <div class="detail">
        <div><h4>Session log</h4>${renderLog()}${renderComposer(s)}</div>
        ${side(s)}
      </div>
    </article>`).join("")}
  </section>`; }).join("")}
</main>`;
const st = document.createElement("style"); st.textContent = stepperCss; document.head.append(st);
document.querySelectorAll(".card-main").forEach((el) => el.onclick = () => el.parentElement.classList.toggle("open"));
if (new URLSearchParams(location.search).has("search")) {
  const q = "interceptor";
  const hl = (t) => t.replace(new RegExp(q, "gi"), (m) => `<mark>${m}</mark>`);
  const ic = (k) => STAGE_ICONS[k];
  const sv = (d) => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const item = (o, on) => `<div class="cmdk-item ${on ? "on" : ""} ${o.stage ? "stage-" + o.stage : ""}"><span class="ico">${o.icon}</span><div><b>${hl(o.title)}</b><small>${o.sub}</small></div><span class="right">${o.right || ""}${on ? '<span class="kbd">↵</span>' : ""}</span></div>`;
  const groups = [
    ["Sessions", [
      { stage: "ringo", icon: ic("ringo"), title: "actionmailer-preview-interceptors", sub: "trails · Reviewer convergence · 3 of 5 findings converged", right: stageChip("ringo") },
    ]],
    ["Stories", [
      { icon: sv('<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>'), title: "actionmailer-preview-interceptors", sub: "RFC 0188 · in-progress · trails#9958" },
      { icon: sv('<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>'), title: "actionmailer-preview-register-interceptor-string-arm", sub: "RFC 0188 · in-progress · bundled" },
      { icon: sv('<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>'), title: "actionmailer-delivery-interceptor-class-names", sub: "RFC 0188 · ready · unclaimed" },
    ]],
    ["Pull requests", [
      { stage: "ringo", icon: ic("merged"), title: "feat(actionmailer): preview interceptors", sub: "trails#9958 · draft · 506 LOC", right: "2h" },
      { stage: "merged", icon: ic("merged"), title: "feat(actionmailer): register_interceptor accepts a class name", sub: "trails#9811 · merged", right: "4d" },
    ]],
    ["Actions", [
      { icon: sv('<path d="M4 12h12M12 6l6 6-6 6"/>'), title: "Message session · actionmailer-preview-interceptors", sub: "Type into its pane" },
      { icon: sv('<path d="M12 5v14M5 12h14"/>'), title: "Spawn a session for “interceptor”", sub: "trails · manual spawn" },
    ]],
  ];
  let first = true;
  document.body.insertAdjacentHTML("beforeend", `<div class="cmdk-scrim"></div><div class="cmdk" role="dialog">
    <div class="cmdk-input">${sv('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>')}<input value="${q}" autofocus><span class="kbd">esc</span><span class="cancel">Cancel</span></div>
    <div class="cmdk-scopes"><span class="chip on">All</span><span class="chip">Sessions 1</span><span class="chip">Stories 3</span><span class="chip">PRs 2</span><span class="chip">trails</span><span class="chip">trailmap</span><span class="chip">tasks</span></div>
    <div class="cmdk-body">${groups.map(([g, items]) => `<div class="cmdk-group">${g}</div>${items.map((o) => { const h = item(o, first); first = false; return h; }).join("")}`).join("")}</div>
    <div class="cmdk-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">⌘</span> <span class="kbd">↵</span> message session</span><span><span class="kbd">tab</span> scope</span></div>
  </div>`);
}
</script>
</body>
</html>
