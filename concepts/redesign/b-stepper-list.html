<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept B · Dashboard</title>
<link rel="stylesheet" href="palette.css">
<script src="data.js"></script><script src="common.js"></script>
<style>
/* header: connection dots, the two rare actions */
.page { max-width: 1320px; }
.fleet-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 18px; }
/* connection state is a quiet line of dots, not a row of boxes */
.pills { display: flex; gap: 4px 16px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.pill .led { width: 7px; height: 7px; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 3px color-mix(in srgb, var(--forest) 18%, transparent); }
.pill.warn .led { background: var(--mustard); box-shadow: 0 0 0 3px color-mix(in srgb, var(--mustard) 25%, transparent); }
.fleet-head .grow { flex: 1; }

/* top panels: one two-column grid, rows share height */
.panels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.panel { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.panel h2 { margin: 0 0 10px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.panel h2 small { font-weight: 400; color: var(--ink-3); }
/* a session's question sits in its own row: the question, its options, and a free answer */
.ask, .stall { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 16px 10px 19px; background: color-mix(in srgb, var(--mustard-soft) 55%, var(--surface)); border-top: 1px solid color-mix(in srgb, var(--mustard) 35%, var(--line)); box-shadow: inset 3px 0 0 var(--mustard); }
.ask p, .stall p { margin: 0; font-size: 13.5px; font-weight: 500; flex: 1 1 300px; }
/* a stalled session: the agent is idle short of the next stage; the strip shows why and offers the prod */
.stall { background: color-mix(in srgb, var(--surface-2) 70%, var(--surface)); border-top-color: var(--line); box-shadow: inset 3px 0 0 var(--ink-3); }
.stall p { display: flex; flex-wrap: wrap; gap: 4px 14px; font-weight: 400; color: var(--ink-2); }
.stall .ok::before { content: "✓ "; color: var(--st-ready); font-weight: 700; }
.flag.idle { background: var(--surface); border: 1px solid var(--line); }
.flag.idle::before { background: var(--ink-3); }
.ask-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.ask-free { display: flex; gap: 6px; flex: 0 1 300px; }
.ask-free input { flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; }
.ask-free input:focus-visible { outline: 2px solid var(--action); outline-offset: 1px; }
/* the CI fixer is a session like any other, marked: a tinted row with a solid label, first in its repo */
.card.fixer { background: color-mix(in srgb, var(--terracotta-soft) 45%, var(--surface)); box-shadow: inset 3px 0 0 var(--terracotta); }
.flag.kind { background: var(--action); color: #fff; gap: 5px; }
.flag.kind::before { content: none; }
.usage-row { display: grid; grid-template-columns: 120px 1fr 40px; gap: 10px; align-items: center; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.usage-row + .usage-row { margin-top: 8px; }
.usage-row span:last-child { text-align: right; color: var(--ink-2); }
.meter { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.loop { display: grid; grid-template-columns: repeat(3, 1fr) auto auto; gap: 10px; align-items: end; }
.loop label { font-size: 11.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.loop input { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 100%; }
.toggle { width: 38px; height: 22px; border-radius: 99px; background: var(--forest); position: relative; margin-bottom: 6px; border: 0; padding: 0; cursor: pointer; }
.toggle::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.btn.danger { border-color: var(--terracotta); color: var(--terracotta); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }

/* one sticky stage header for the whole list */
.list-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 2fr) 150px; gap: 24px; }
.stage-header { position: sticky; top: var(--topbar-h); z-index: 3; background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(12px); padding: 10px 16px 10px 19px; border-bottom: 1px solid var(--line); }
.stepper.header .step::after { visibility: hidden; }
.stepper.header .node { background: color-mix(in srgb, var(--c) 30%, var(--surface)); border: 0; color: var(--ink); }
.stepper.header .hl { font-size: 11px; font-weight: 600; color: var(--ink-2); line-height: 1.2; white-space: normal; max-width: 74px; }
.step .lbl { display: none; }
/* a stage not reached yet is a dot: the header names the column, and the current stage stands out */
.card .step.todo .node { width: 10px; height: 10px; margin: 0 8px; border-style: solid; border-color: var(--clay); }
.card .step.todo .node svg { display: none; }
.filters { display: flex; gap: 6px; align-items: center; }
.chip.filter { font: inherit; font-size: 12px; font-weight: 600; border: 0; cursor: pointer; }
.chip.filter[aria-pressed="true"] { background: var(--soil); color: var(--cream); }
.chip.filter:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
.only-needs .card:not(.needs), .only-needs .merged-line, .only-needs .repo:not(:has(.card.needs)) { display: none; }

.repo { margin-top: 24px; }
.repo-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; padding-left: 2px; }
.repo-head .muted { font-size: 12px; font-variant-numeric: tabular-nums; }
.repo-head h2 { font-size: 14px; font-weight: 600; letter-spacing: -0.005em; margin: 0; }
/* one surface per repo, a hairline between sessions: rows, not a stack of boxes */
.sessions { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.card { box-shadow: inset 3px 0 0 var(--c); }
.card + .card, .card + .merged-line { border-top: 1px solid var(--line); }
.card-main { align-items: center; padding: 12px 16px 12px 19px; cursor: pointer; transition: background .12s; }
.card-main:hover { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.card.open > .card-main { background: color-mix(in srgb, var(--surface-2) 45%, transparent); }
.expand { font: inherit; background: none; border: 0; padding: 2px 4px; color: var(--ink-3); font-size: 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; border-radius: 6px; }
.expand::after { content: "›"; transition: transform .15s; }
.card.open .expand::after { transform: rotate(90deg); }
.expand:focus-visible, .toggle:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
.pr-link { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--forest); text-decoration: none; background: var(--forest-soft); padding: 2px 8px; border-radius: 6px; }
.pr-link.none { color: var(--ink-2); background: var(--surface-2); }
.stories { display: flex; flex-wrap: wrap; gap: 2px 10px; margin: 6px 0 4px; }
.story { font-size: 13px; color: var(--ink-2); text-decoration: none; border-bottom: 1px dotted var(--ink-3); }
.story.lead { font-size: 14.5px; font-weight: 600; letter-spacing: -0.005em; color: var(--ink); flex: 0 0 100%; border: 0; word-break: break-word; }
.note { color: var(--ink-2); font-size: 12.5px; }
/* flags beside the PR link say what kind of row this is and what is wrong with it */
.tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.flag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--mustard-soft); color: var(--ink); white-space: nowrap; }
.flag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mustard); }
.flag.bad { background: var(--terracotta-soft); }
.flag.bad::before { background: var(--terracotta); }
.meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.prog { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prog b { color: var(--ink); font-weight: 600; }
.prog-m { font-weight: 400; color: var(--ink-2); }
details.panel > summary { list-style: none; pointer-events: none; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel:not([open]) h2 { margin: 0; }
.now-label { display: none; }
.detail { display: none; border-top: 1px solid var(--line); padding: 16px 16px 18px 19px; background: color-mix(in srgb, var(--surface-2) 30%, transparent); }
.card.open .detail { display: grid; grid-template-columns: 1fr 240px; gap: 20px; }
.detail h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 60px 1fr; gap: 6px 10px; font-size: 13px; margin: 0 0 16px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-all; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; margin-bottom: 6px; }
.bar i { display: block; }
.side p { font-size: 12px; color: var(--ink-2); margin: 0 0 14px; }
.merged-line { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 9px 16px 9px 19px; font-size: 12.5px; color: var(--ink-2); background: color-mix(in srgb, var(--st-merged) 6%, transparent); box-shadow: inset 3px 0 0 var(--st-merged); }
.merged-line b { color: var(--st-merged); font-weight: 600; }

/* ⌘K palette */
.cmdk-scrim { position: fixed; inset: 0; background: rgba(43,33,26,.28); backdrop-filter: blur(6px); z-index: 20; }
.cmdk { position: fixed; top: 96px; left: 50%; translate: -50% 0; width: 680px; max-height: 70vh; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 0 0 1px rgba(43,33,26,.04), 0 8px 24px rgba(43,33,26,.12), 0 32px 80px rgba(43,33,26,.24); z-index: 21; overflow: hidden; }
.cmdk-input { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.cmdk-input svg { color: var(--terracotta); flex: none; }
.cmdk-input input { flex: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 17px; color: var(--ink); }
.cmdk-scopes { display: flex; gap: 6px; padding: 10px 18px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.cmdk-scopes .chip.on { background: var(--soil); color: var(--cream); }
.cmdk-body { overflow-y: auto; padding: 6px 8px 10px; }
.cmdk-group { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 12px 10px 6px; }
.cmdk-item { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 8px; }
.cmdk-item.on { background: color-mix(in srgb, var(--terracotta) 12%, var(--surface)); box-shadow: inset 3px 0 0 var(--terracotta); }
.cmdk-item .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c, var(--clay)) 25%, var(--surface)); color: var(--ink); }
.cmdk-item b { font-weight: 600; font-size: 13.5px; display: block; }
.cmdk-item mark { background: var(--mustard-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.cmdk-item small { color: var(--ink-3); font-size: 12px; }
.cmdk-item .right { font-size: 12px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.cmdk-foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); background: var(--surface-2); }
.cmdk-input .cancel { display: none; }

@media (max-width: 700px) {
  .topbar { padding: 0 16px; gap: 12px; }
  .topbar .nav, .topbar .search { display: none; }
  .page { padding: 16px 16px 40px; }
  .fleet-head { gap: 10px; }
  .fleet-head .grow { display: none; }
  .pills { order: 3; flex: 0 0 100%; }
  .panels { grid-template-columns: 1fr; gap: 8px; margin-inline: -16px; }
  .panel { border-radius: 0; border-inline: 0; }
  .ask, .stall { padding: 12px 14px 12px 17px; }
  .ask p, .stall p, .ask-free { flex-basis: 100%; }
  .usage-row { grid-template-columns: 110px 1fr 36px; }
  .loop { grid-template-columns: 1fr 1fr 1fr; }
  .loop .btn { grid-column: 2 / -1; }
  details.panel > summary { pointer-events: auto; cursor: pointer; }
  details.panel h2 small::after { content: " ›"; display: inline-block; margin-left: 6px; transition: transform .15s; }
  details.panel[open] h2 small::after { transform: rotate(90deg); }
  .meta .prog { display: none; }
  .meta { flex-direction: row; align-items: center; gap: 8px; }
  .stage-header { display: block; padding: 8px 16px; margin-inline: -16px; }
  .stage-header .stepper { display: none; }
  .sessions { margin-inline: -16px; border-radius: 0; border-inline: 0; }
  .card-main { grid-template-columns: 1fr auto; gap: 10px; padding: 14px 14px 14px 17px; }
  .card-main .stepper { grid-column: 1 / -1; grid-row: 2; }
  .now-label { display: block; grid-column: 1 / -1; grid-row: 3; margin-top: -4px; font-size: 12px; font-weight: 600; color: var(--ink); }
  .now-label::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; }
  .card.open .detail { grid-template-columns: 1fr; padding: 14px; }
  .log-row { grid-template-columns: 52px 18px 1fr; padding-inline: 10px; }
  .log-row .tool-call { word-break: break-all; }
  .cmdk { inset: 0; translate: none; width: auto; max-height: none; border-radius: 0; border: 0; }
  .cmdk-input { padding: 12px 16px; }
  .cmdk-input .kbd { display: none; }
  .cmdk-input .cancel { display: inline; color: var(--terracotta); font-weight: 600; }
  .cmdk-foot { display: none; }
  .cmdk-item { padding: 10px; }
  .cmdk-item .right .kbd, .cmdk-item .right .chip { display: none; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const REPOS = ["trails", "trailmap", "tasks"];
const storyList = (s) => s.stories || [s.story];
const live = SESSIONS.filter((s) => s.stage !== "merged");

const progress = (s) => {
  if (s.ringo) {
    const { done, total } = s.ringo;
    return `<h4>Reviewer convergence</h4><div class="bar"><i style="width:${(100 * done) / total}%;background:var(--st-ringo)"></i></div><p>${done} of ${total} findings converged</p>`;
  }
  if (s.ci) {
    const { pass, fail, run } = s.ci, n = pass + fail + run;
    return `<h4>Checks</h4><div class="bar"><i style="width:${(100 * pass) / n}%;background:var(--st-ready)"></i><i style="width:${(100 * fail) / n}%;background:var(--terracotta)"></i></div><p>${pass} passed · ${fail} failed · ${run} running</p>`;
  }
  return "";
};
// The one figure that says how far along the current stage is.
const progText = (s) => {
  if (s.ringo) return `<b>${s.ringo.done}</b> of ${s.ringo.total} findings`;
  if (s.ci) return `<b>${s.ci.pass}</b> of ${s.ci.pass + s.ci.fail + s.ci.run} checks`;
  return `<b>${s.loc}</b> of 700 LOC`;
};
const wrench = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0 5 5L11 20a2.1 2.1 0 0 1-3-3z"/></svg>`;
const flags = (s) => (s.fixer ? `<span class="flag kind">${wrench}CI fixer</span><span class="flag bad">main is red</span>` : "") + (s.ci && s.ci.fail ? `<span class="flag bad">${s.ci.fail} check failed</span>` : "");
const ask = (s) => !s.ask ? "" : `
    <div class="ask" role="group" aria-label="Question from ${s.story}">
      <span class="flag">Waiting on you</span>
      <p>${s.ask.q}</p>
      <div class="ask-opts">${s.ask.options.map((o) => `<button class="btn sm">${o}</button>`).join("")}</div>
      <div class="ask-free"><input type="text" aria-label="Answer in your own words" placeholder="…or answer in your own words"><button class="btn sm primary">Send</button></div>
    </div>`;
// An idle agent short of the next stage is stalled. Each rule names the evidence and the prod, which is a message to the agent.
const stall = (s) => {
  if (!s.idle || s.ask) return null;
  if (s.stage === "self") return { why: ["self review checks passed"], open: ["no reviewer asked"], prod: "Request review?" };
  if (s.stage === "ringo" && s.ringo.done === s.ringo.total) return { why: ["all findings converged"], open: [], prod: "Move on to CI?" };
  if (s.stage === "ci") {
    if (s.ci.fail) return { why: [], open: [`${s.ci.fail} check failed`], prod: "Fix the failing check?" };
    if (!s.ci.run) return { why: ["CI green", "reviews clean"], open: ["PR still a draft"], prod: "Mark it ready?" };
  }
  return null;
};
const stalled = (s) => { const st = stall(s); return !st ? "" : `
    <div class="stall" role="group" aria-label="Stalled: ${s.story}">
      <span class="flag idle">Stalled · idle ${s.idle}</span>
      <p>${st.why.map((w) => `<span class="ok">${w}</span>`).join("")}${st.open.map((w) => `<span>${w}</span>`).join("")}</p>
      <button class="btn sm primary" aria-label="Message the agent: ${st.prod}" title="Sends this as a message to the agent">${st.prod}</button>
    </div>`; };
const needs = (s) => s.ask || stall(s) || (s.ci && s.ci.fail) || s.stage === "ready";
const side = (s) => `
  <div class="side">
    <dl class="kv">
      <dt>RFC</dt><dd>${s.rfc || "—"}</dd>
      <dt>Branch</dt><dd class="mono">${s.branch}</dd>
      <dt>PR</dt><dd>${s.pr ? prState(s) : "not opened"}</dd>
    </dl>
    <h4>Diff</h4><div class="bar"><i style="width:${(100 * s.loc) / 700}%;background:var(--soil)"></i></div><p>${s.loc} of 700 LOC</p>
    ${progress(s)}
    <button class="btn sm">Open pane</button>
  </div>`;

const card = (s) => `
  <article class="card stage-${s.stage} ${s.fixer ? "fixer" : ""} ${needs(s) ? "needs" : ""} ${openId === s.id ? "open" : ""}" id="${s.id}">
    <div class="card-main list-grid">
      <div>
        <div class="tags">${s.pr ? `<a class="pr-link" href="#">↗ ${s.repo}#${s.pr}</a>` : `<span class="pr-link none">no PR yet</span>`}${flags(s)}</div>
        <div class="stories">${storyList(s).map((id, i) => `<a href="#" class="story${i === 0 ? " lead" : ""}">${id}</a>`).join("")}</div>
        <div class="note">${s.note}</div>
      </div>
      ${stepper(s.stage, s)}
      <span class="now-label">${stageOf(s.stage).label}${s.stage === "ready" ? "" : `<span class="prog-m"> · ${progText(s)}</span>`}</span>
      <div class="meta">${s.stage === "ready" ? `<button class="btn sm primary">Merge</button>` : `<span class="prog">${progText(s)}</span>`}<button class="expand" aria-expanded="${openId === s.id}" aria-controls="${s.id}-detail" aria-label="Session details for ${s.story}">${s.age}</button></div>
    </div>${ask(s)}${stalled(s)}
    <div class="detail" id="${s.id}-detail">
      <div><h4>Session log</h4>${renderLog(s)}${renderComposer(s)}</div>
      ${side(s)}
    </div>
  </article>`;

const repo = (name) => {
  const list = SESSIONS.filter((s) => s.repo === name).sort((a, b) => (b.fixer || 0) - (a.fixer || 0) || stageIdx(a.stage) - stageIdx(b.stage));
  const active = list.filter((s) => s.stage !== "merged"), merged = list.filter((s) => s.stage === "merged");
  return `<section class="repo">
    <div class="repo-head"><h2>${name}</h2><span class="muted">${active.length} active</span></div>
    <div class="sessions">${active.map(card).join("")}
    ${merged.length ? `<div class="merged-line"><b>Merged today · ${merged.length}</b>${merged.map((s) => `<a class="mono" href="#">${s.repo}#${s.pr}</a> <span>${s.story}</span>`).join("")}</div>` : ""}</div>
  </section>`;
};

document.getElementById("app").innerHTML = topbar() + `
<main class="page">
  <div class="fleet-head">
    <h1 class="sr-only">Dashboard</h1>
    <div class="pills">
      <span class="pill"><span class="led"></span>events</span>
      <span class="pill"><span class="led"></span>tmux</span>
      <span class="pill"><span class="led"></span>usage scraper</span>
      <span class="pill"><span class="led"></span>claude · ${live.length - 2}</span>
      <span class="pill warn"><span class="led"></span>codex · 2</span>
    </div>
    <span class="grow"></span>
    <button class="btn sm">Broadcast</button>
    <button class="btn sm">Spawn</button>
  </div>
  <div class="panels">
    <details class="panel">
      <summary><h2>Usage <small>5h window 81% · resets in 2h 14m</small></h2></summary>
      <div class="usage-row"><span>Claude · week</span><div class="meter"><i style="width:62%;background:var(--forest)"></i></div><span>62%</span></div>
      <div class="usage-row"><span>Claude · 5h window</span><div class="meter"><i style="width:81%;background:var(--mustard)"></i></div><span>81%</span></div>
      <div class="usage-row"><span>Codex · week</span><div class="meter"><i style="width:34%;background:var(--clay)"></i></div><span>34%</span></div>
    </details>
    <details class="panel">
      <summary><h2>Loop <small>spawning paused · main is red</small></h2></summary>
      <div class="loop">
        <label>Live cap<input type="number" value="14"></label>
        <label>Queue cap<input type="number" value="4"></label>
        <label>Every (min)<input type="number" value="10"></label>
        <label>Bundle<button class="toggle" role="switch" aria-checked="true" aria-label="Bundle mode"></button></label>
        <button class="btn sm danger">Pause all</button>
      </div>
    </details>
  </div>
  <div class="stage-header list-grid"><div class="filters"><button class="chip filter" data-f="all">All ${live.length}</button><button class="chip filter" data-f="needs">Needs you ${live.filter(needs).length}</button></div>${stageHeader()}<span></span></div>
  ${REPOS.map(repo).join("")}
</main>`;
// Usage and Loop are always open on a wide page and fold to their summary line on a phone.
const wide = matchMedia("(min-width: 701px)");
const syncPanels = () => document.querySelectorAll("details.panel").forEach((d) => {
  d.open = wide.matches;
  d.querySelector("summary").tabIndex = wide.matches ? -1 : 0;
});
syncPanels();
wide.addEventListener("change", syncPanels);
// `?filter=needs` starts on the sessions that want something from you.
const setFilter = (f) => {
  document.body.classList.toggle("only-needs", f === "needs");
  document.querySelectorAll(".chip.filter").forEach((b) => b.setAttribute("aria-pressed", b.dataset.f === f));
};
document.querySelectorAll(".chip.filter").forEach((b) => { b.onclick = () => setFilter(b.dataset.f); });
setFilter(new URLSearchParams(location.search).get("filter") === "needs" ? "needs" : "all");
// A log opens at its newest entry.
const toEnd = (card) => { const log = card.querySelector(".log"); log.scrollTop = log.scrollHeight; };
document.querySelectorAll(".card.open").forEach(toEnd);
// The expand button is the control; a click anywhere else on the row is a
// pointer shortcut to it, so no interactive element sits inside another.
document.querySelectorAll(".card-main").forEach((el) => {
  const btn = el.querySelector(".expand");
  btn.onclick = (e) => { e.stopPropagation(); btn.setAttribute("aria-expanded", el.parentElement.classList.toggle("open")); toEnd(el.parentElement); };
  el.onclick = (e) => { if (!e.target.closest("a, button")) btn.click(); };
});

if (new URLSearchParams(location.search).has("search")) {
  const q = "interceptor";
  const hl = (t) => t.replace(new RegExp(q, "gi"), (m) => `<mark>${m}</mark>`);
  const sv = (d) => `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
  const doc = sv('<path d="M6 3h9l3 3v15H6z"/><path d="M9 10h6M9 14h6"/>');
  const item = (o, on) => `<div class="cmdk-item ${on ? "on" : ""} ${o.stage ? "stage-" + o.stage : ""}"><span class="ico">${o.icon}</span><div><b>${hl(o.title)}</b><small>${o.sub}</small></div><span class="right">${o.right || ""}${on ? '<span class="kbd">↵</span>' : ""}</span></div>`;
  const groups = [
    ["Sessions", [{ stage: "ringo", icon: STAGE_ICONS.ringo, title: "actionmailer-preview-interceptors", sub: "trails · Reviewer convergence · 3 of 5 findings", right: stageChip("ringo") }]],
    ["Stories", [
      { icon: doc, title: "actionmailer-preview-interceptors", sub: "RFC 0188 · in progress · trails#9958" },
      { icon: doc, title: "actionmailer-preview-register-interceptor-string-arm", sub: "RFC 0188 · in progress · same bundle" },
      { icon: doc, title: "actionmailer-delivery-interceptor-class-names", sub: "RFC 0188 · ready · unclaimed" },
    ]],
    ["Pull requests", [
      { stage: "ringo", icon: STAGE_ICONS.merged, title: "feat(actionmailer): preview interceptors", sub: "trails#9958 · draft", right: "2h" },
      { stage: "merged", icon: STAGE_ICONS.merged, title: "feat(actionmailer): register_interceptor accepts a class name", sub: "trails#9811 · merged", right: "4d" },
    ]],
    ["Actions", [
      { icon: sv('<path d="M4 12h12M12 6l6 6-6 6"/>'), title: "Message actionmailer-preview-interceptors", sub: "Typed into its pane" },
      { icon: sv('<path d="M12 5v14M5 12h14"/>'), title: "Spawn a session for “interceptor”", sub: "Pick the repo next" },
      { icon: sv('<path d="M4 10v4h4l6 5V5L8 10z"/>'), title: "Broadcast “interceptor” to all agents", sub: "Typed into every live pane" },
    ]],
  ];
  let first = true;
  document.body.insertAdjacentHTML("beforeend", `<div class="cmdk-scrim"></div><div class="cmdk" role="dialog" aria-label="Search">
    <div class="cmdk-input">${sv('<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>')}<input value="${q}" aria-label="Search"><span class="kbd">esc</span><span class="cancel">Cancel</span></div>
    <div class="cmdk-scopes"><span class="chip on">All</span><span class="chip">Sessions 1</span><span class="chip">Stories 3</span><span class="chip">PRs 2</span><span class="chip">trails</span><span class="chip">trailmap</span><span class="chip">tasks</span></div>
    <div class="cmdk-body">${groups.map(([g, items]) => `<div class="cmdk-group">${g}</div>${items.map((o) => { const h = item(o, first); first = false; return h; }).join("")}`).join("")}</div>
    <div class="cmdk-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> move</span><span><span class="kbd">↵</span> open</span><span><span class="kbd">⌘</span> <span class="kbd">↵</span> message session</span><span><span class="kbd">tab</span> scope</span></div>
  </div>`);
}
</script>
</body>
