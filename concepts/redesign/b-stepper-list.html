<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concept B · Fleet stepper</title>
<link rel="stylesheet" href="palette.css">
<script src="data.js"></script><script src="common.js"></script>
<style>
.status { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12.5px; font-weight: 500; }
.pill .led { width: 8px; height: 8px; border-radius: 50%; background: var(--forest); box-shadow: 0 0 0 3px color-mix(in srgb, var(--forest) 20%, transparent); }
.pill.bad .led { background: var(--terracotta); box-shadow: 0 0 0 3px color-mix(in srgb, var(--terracotta) 20%, transparent); }
.pill.warn .led { background: var(--mustard); }
.status .grow { flex: 1; }
.btn.danger { border-color: var(--terracotta); color: var(--terracotta); }
.panels { display: grid; grid-template-columns: 1.25fr 1fr; gap: 14px; margin-bottom: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
.panel h2 small { font-weight: 400; color: var(--ink-3); }
.stack { display: flex; flex-direction: column; gap: 14px; }
.ask { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--mustard-soft); margin-bottom: 8px; align-items: center; }
.ask q { display: block; color: var(--ink); font-size: 13px; margin-top: 2px; }
.ask q::before, .ask q::after { content: ""; }
.fixer { display: flex; gap: 12px; align-items: center; font-size: 13px; padding: 10px 12px; border-radius: 12px; background: var(--terracotta-soft); }
.usage-row { display: grid; grid-template-columns: 70px 1fr 80px; gap: 10px; align-items: center; font-size: 12.5px; margin-bottom: 8px; }
.meter { height: 9px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 99px; }
.loop { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.loop label { font-size: 11.5px; color: var(--ink-3); display: flex; flex-direction: column; gap: 4px; }
.loop input[type=number] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; width: 100%; }
.toggle { width: 38px; height: 22px; border-radius: 99px; background: var(--forest); position: relative; margin-top: 3px; }
.toggle::after { content: ""; position: absolute; right: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input, .inline select { font: inherit; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; color: var(--ink); }
.inline input { flex: 1; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 12px; }
.section-head h2 { font-family: var(--display); font-size: 22px; margin: 0; }
.filters { display: flex; gap: 8px; margin-bottom: 14px; }
.sessions { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; border-left: 5px solid var(--c); }
.card-main { display: grid; grid-template-columns: minmax(260px, 1.1fr) minmax(480px, 2fr) 110px; gap: 24px; align-items: center; padding: 16px 20px; cursor: pointer; }
.card h3 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
.meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 12.5px; }
.note { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; }
.right { text-align: right; color: var(--ink-3); font-size: 12px; }
.caret { display: inline-block; transition: transform .2s; margin-left: 6px; }
.card.open .caret { transform: rotate(90deg); }
.detail { display: none; border-top: 1px solid var(--line); padding: 16px 20px 20px; background: linear-gradient(var(--cream), var(--surface)); }
.card.open .detail { display: grid; grid-template-columns: 1fr 280px; gap: 20px; }
.side h4, .detail h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; margin-bottom: 16px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; }
.bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar i { display: block; }
</style>
</head>
<body>
<div id="app"></div>
<script>
const side = (s) => `
  <div class="side">
    <h4>Session</h4>
    <dl class="kv">
      <dt>Story</dt><dd class="mono">${s.story}</dd>
      <dt>RFC</dt><dd>${s.rfc}</dd>
      <dt>PR</dt><dd>${prLink(s)} <span class="chip">draft</span></dd>
      <dt>Package</dt><dd>${s.pkg}</dd>
      <dt>Diff</dt><dd>${s.loc} / 700 LOC</dd>
    </dl>
    <h4>Reviewer convergence</h4>
    <div class="bar"><i style="width:60%;background:var(--forest)"></i><i style="width:20%;background:var(--terracotta)"></i></div>
    <p class="muted" style="font-size:12px;margin:6px 0 16px">3 converged · 1 in progress · 1 open</p>
    <div style="display:flex;gap:8px"><button class="btn">Open pane</button><button class="btn">View PR</button></div>
  </div>`;
document.getElementById("app").innerHTML = topbar() + `
<main class="page">
  <div class="page-head">
    <div><h1>Fleet</h1><p>Open PRs, panes, spawns and CI, live from ringo · ${SESSIONS.filter((s) => s.stage !== "merged").length} sessions in flight</p></div>
  </div>
  <div class="status">
    <span class="pill"><span class="led"></span>events</span>
    <span class="pill"><span class="led"></span>tmux</span>
    <span class="pill bad"><span class="led"></span>main CI · AR MariaDB (2/3)</span>
    <span class="pill"><span class="led"></span>usage scraper ⟳</span>
    <span class="pill"><span class="led"></span>claude · 7 live</span>
    <span class="pill warn"><span class="led"></span>codex · 2 live</span>
    <span class="grow"></span>
    <button class="btn danger">Pause all</button>
  </div>
  <div class="panels">
    <div class="stack">
      <div class="panel">
        <h2>Agents waiting on you <small>2 questions</small></h2>
        <div class="ask"><div><span class="mono">zeitwerk-eager-load-namespace</span><q>MariaDB shard 2 red twice on an unrelated test. Rerun, or file a flake?</q></div><button class="btn">Reply</button></div>
        <div class="ask"><div><span class="mono">actionmailer-preview-interceptors</span><q>Finding 5 asks for a scoped skip. OK to add, or converge?</q></div><button class="btn">Reply</button></div>
      </div>
      <div class="panel">
        <h2>CI fixer <small>main is red</small></h2>
        <div class="fixer"><span class="chip stage stage-ringo"><span class="dot"></span>fixing</span><span>Worker on <span class="mono">ar-mariadb-shard-flake-3c1e</span> · spawn loop paused · 12m</span></div>
      </div>
    </div>
    <div class="stack">
      <div class="panel">
        <h2>Usage <small>resets in 2h 14m</small></h2>
        <div class="usage-row"><span>Claude</span><div class="meter"><i style="width:62%;background:var(--forest)"></i></div><span class="muted">62% · week</span></div>
        <div class="usage-row"><span>Session</span><div class="meter"><i style="width:81%;background:var(--mustard)"></i></div><span class="muted">81% · 5h</span></div>
        <div class="usage-row" style="margin:0"><span>Codex</span><div class="meter"><i style="width:34%;background:var(--clay)"></i></div><span class="muted">34% · week</span></div>
      </div>
      <div class="panel">
        <h2>Loop <small>last spawn 6m ago · next in 4m</small></h2>
        <div class="loop">
          <label>Live cap <span class="muted">7 now</span><input type="number" value="8"></label>
          <label>Queue cap <span class="muted">3 open</span><input type="number" value="4"></label>
          <label>Interval (min)<span>&nbsp;</span><input type="number" value="10"></label>
          <label>Bundle<span>&nbsp;</span><span class="toggle"></span></label>
        </div>
      </div>
    </div>
  </div>
  <div class="actions">
    <div class="panel"><h2>Broadcast to agents <small>typed into each pane</small></h2>
      <div class="inline"><input placeholder="e.g. main is red, rebase before you push again"><button class="btn">all</button><button class="btn">CI red</button></div></div>
    <div class="panel"><h2>Manual spawn <small><a href="#">poke 1 stalled agent</a></small></h2>
      <div class="inline"><select><option>trails</option><option>trailmap</option><option>tasks</option></select><input placeholder="Enter a task for Claude…"><button class="btn primary" style="background:var(--forest);border-color:var(--forest)">Spawn</button></div></div>
  </div>
  <div class="section-head"><h2>Sessions</h2><span class="muted">trails · ${SESSIONS.length} sessions</span></div>
  <section class="sessions">${SESSIONS.map((s) => `
    <article class="card stage-${s.stage} ${openId === s.id ? "open" : ""}">
      <div class="card-main">
        <div>
          <h3>${s.story}</h3>
          <div class="meta">${stageChip(s.stage)} ${prLink(s)} <span>${s.pkg}</span></div>
          <div class="note">${s.note}</div>
        </div>
        ${stepper(s.stage)}
        <div class="right">${s.age} ago<span class="caret">›</span><br>${s.loc} LOC</div>
      </div>
      <div class="detail">
        <div><h4>Session log</h4>${renderLog()}${renderComposer(s)}</div>
        ${side(s)}
      </div>
    </article>`).join("")}
  </section>
</main>`;
const st = document.createElement("style"); st.textContent = stepperCss; document.head.append(st);
document.querySelectorAll(".card-main").forEach((el) => el.onclick = () => el.parentElement.classList.toggle("open"));
</script>
</body>
</html>
