name: PR watchdog

# Notices a pull request CI never started on. `ci.yml` cannot do this for
# itself: a workflow that did not run has nowhere to say so.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: write

jobs:
  runs-started:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      # The comment, its once-only marker and the failing exit live in the
      # script, where `--self-test` holds them in ci.yml.
      - name: Every open PR older than ten minutes has a run
        run: ./scripts/ci/prs-without-runs.sh --comment
