name: CI

on:
  pull_request:
  push:
    branches: [main]

# Node 24: @blazetrails/rack throws a regex SyntaxError at import time on 20
# and 22, so the LTS default would turn every job red for the wrong reason.
# .node-version is the single source of truth, shared with the Dockerfile.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A version is required here; package.json deliberately carries no
      # `packageManager` key, which is the other way to satisfy it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec trails-tsc-views build --views app/views
      - run: pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # POSTGRES, because the `hub` database is Postgres (config/database.ts) and
    # the tests that read it refuse to pass silently without one: they
    # `describe.skipIf(!hasHubTestDatabase())`, which prints every skipped
    # name. `live-database-tests-never-run-in-ci-and-three-have-rotted` is
    # what that rule comes from — three tests had rotted behind a silent skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailmap_hub_test
        ports:
          - 5432:5432
        # Without the health check the first query races the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub_test
      # The same database again under the BOOT variable, so
      # `test/initializers/hub-database.test.ts` exercises the branch that
      # connects rather than the one that tolerates an unset variable. Without
      # it that case returns early and proves nothing — the silent skip this
      # job's postgres service exists to avoid.
      HUB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub_test
    steps:
      - uses: actions/checkout@v4
      # A version is required here; package.json deliberately carries no
      # `packageManager` key, which is the other way to satisfy it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec trails-tsc-views build --views app/views
      - run: pnpm exec trails-tsc-views build --views test/fixtures/views --in-place
      # The hub schema, through the real entry point. `test/support/hub-schema.ts`
      # connects and truncates but does not migrate — see the note there — and
      # fails with this command in its message when the schema is missing.
      #
      # NO `--database hub`: that flag narrows the registered configurations to
      # the one database, which makes it answer `isPrimary` and loads
      # `db/schema.ts` — the TASK domain's schema — into Postgres. It is a
      # trails defect (tracked upstream), and the unflagged command, which
      # registers both configurations, is both correct and what a Rails user
      # would run.
      - name: Prepare the hub schema
        env:
          HUB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub_test
        run: pnpm db:migrate
      - run: pnpm test

  # The sso plugin re-injects Authelia's auth directives into the generated
  # nginx config on every reload, using two text matchers that a comment can
  # trip. Both failures are silent and both end with the dashboard served
  # unauthenticated, so they are checked here rather than left to review.
  nginx-sigil:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-nginx-sigil.sh
      # The Rails app's copy (rails/nginx.conf.sigil), which differs only in its
      # loopback port and carries the same two comment hazards.
      - run: SIGIL_PATH=rails/nginx.conf.sigil ./scripts/check-nginx-sigil.sh
      # Proves the guard still detects both regressions, rather than passing
      # because it stopped looking.
      - run: ./scripts/check-nginx-sigil.sh --self-test

  # The production smoke suite cannot run here: it asserts against the live
  # application, whose API binds to loopback on the box. What CI can hold is
  # that the suite still DETECTS each regression, by name, against a canned
  # curl — a suite that passes because it stopped looking is worse than none.
  smoke-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke-prod.sh --self-test
      # The schedule's own guarantees — one run at a time, a hung tier killed,
      # every run written where /crons reads it — against a suite that passes,
      # fails or hangs on demand.
      - run: ./scripts/smoke-cron.sh --self-test
      # pr-watchdog.yml runs only on a schedule, from `main`: this is what
      # proves its comment-once-and-fail path before it is needed.
      - run: ./scripts/ci/prs-without-runs.sh --self-test

  boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same service as `test`, for a different reason:
    # `config/initializers/hub-database.ts` refuses to boot without
    # `HUB_DATABASE_URL`, exactly as the tasks-database initializer refuses
    # without `TASKS_DATABASE`. A boot smoke test that skipped it would be
    # testing a process the deployment never runs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailmap_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub
    steps:
      - uses: actions/checkout@v4
      # A version is required here; package.json deliberately carries no
      # `packageManager` key, which is the other way to satisfy it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: ./scripts/smoke-boot.sh

  # THE IMAGE. `boot` proves the checkout starts; the deploy runs the image, and
  # a broken Dockerfile step, a file `.dockerignore` kept out of the context or
  # a runtime stage missing what the build stage had passes every other job.
  # The script brings its own Postgres and network, so there is no service here.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from this commit
        run: docker build -t trailmap:ci .
      - name: The built image migrates, serves /up and its stylesheet, and stops cleanly
        run: ./scripts/smoke-image.sh trailmap:ci

  # scripts/dashboard-e2e.ts, in the Chrome the runner image carries.
  # A run takes about 1½ minutes; the timeout keeps a hung one from holding
  # the check for GitHub's six-hour default. Every other job carries one too.
  dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailmap_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: ./scripts/dashboard-e2e.sh

  # THE SHOW-PAGE SNAPSHOT. `pnpm gate:pages` diffs trailmap's /rfc/<id> and
  # /story/<id> against ringo's over the whole database; it found four port
  # defects that hand-verification had missed, and it cannot run here, because
  # ringo serves from a checkout and a database that exist only on the box.
  #
  # It is also about to stop proving anything. `land-the-ringo-read-model-
  # deletion` moves ringo's loadIndex onto trailmap's own API, after which
  # ringo's show pages render from data trailmap produced and the gate compares
  # trailmap against itself — reporting EQUIVALENT forever. It goes circular,
  # not red, which is worse than losing it: the green check keeps being cited.
  #
  # So ringo's answers were recorded while ringo still had its own read model,
  # and this replays them. Both fixtures were captured in one pass — the facts
  # ringo stated, and the database rows they were rendered from — so the replay
  # needs no ringo, no database and no tasks checkout, and what it proves is
  # what the four defects were about: how trailmap orders, ranks and labels a
  # fixed set of rows. Re-recording is deliberate; README says when.
  page-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # A version is required here; package.json deliberately carries no
      # `packageManager` key, which is the other way to satisfy it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec trails-tsc-views build --views app/views
      - name: The show pages still say what ringo said
        run: pnpm gate:snapshot
      # Proves the gate still detects a difference, rather than passing because
      # it stopped looking.
      - name: The snapshot gate still goes red on a difference
        run: pnpm gate:snapshot --self-test

  # THE GATE (RFC 0136). trailmap's ready queue is a rewrite of the CLI's
  # ranking functions, and the only thing that makes that safe is proving the
  # two produce the same queue over the same database. It is the merge
  # condition for the ranking and verb work, so it runs on every PR.
  #
  # CI has no copy of the live tasks.db (it lives in another repo's .git), so
  # this builds an equivalent one: check the content repo out, ingest its
  # markdown tree into a fresh database, then point BOTH implementations at
  # that single file. One snapshot, by construction.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: blazetrailsdev/tasks
          path: tasks
      # A version is required here; package.json deliberately carries no
      # `packageManager` key, which is the other way to satisfy it.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile
        working-directory: tasks
      - name: Ingest the content tree into a database both sides can read
        working-directory: tasks
        env:
          TASKS_DB: ${{ github.workspace }}/tmp/ci-tasks.db
        run: |
          mkdir -p "$(dirname "$TASKS_DB")"
          # ingest writes rows; it does not create the schema.
          pnpm db:migrate
          ./bin/tasks ingest
      - name: trailmap's ready queue == the CLI's, byte for byte
        env:
          TASKS_DATABASE: ${{ github.workspace }}/tmp/ci-tasks.db
          TASKS_CLI: ${{ github.workspace }}/tasks
        run: pnpm gate
      # The tests that only run with TASKS_DATABASE set. `test` has no tasks
      # database, so there they skip — and three of them rotted unseen. This
      # job already has one, so they run here on every PR.
      #
      # NOT test/serializers/story-json.test.ts, the fourth: it diffs against
      # the `index.json` the CLI publishes beside a live checkout, which is
      # untracked and so does not exist here. It still runs only on the box.
      - name: The live-database tests, against the ingested database
        env:
          TASKS_DATABASE: ${{ github.workspace }}/tmp/ci-tasks.db
        run: >-
          pnpm exec vitest run
          test/initializers/tasks-database.test.ts
          test/models/tasks-database-config.test.ts
          test/models/tasks-database.test.ts

      # The two ringo gates. Both run ringo's OWN code — the list pages'
      # browser scripts and ringo's `core` Go package, vendored verbatim under
      # vendor/ringo at a pinned commit — against trailmap's port over this
      # same database. btwhooks has no remote to check out, which is why the
      # snapshot is vendored rather than cloned here; scripts/vendor-ringo.sh
      # regenerates it and bumping the pin is its own PR.
      - uses: actions/setup-go@v5
        with:
          # The release that built vendor/ringo/core.wasm, not go.mod's
          # floor: the check below compares bytes, and bytes are per-release.
          go-version-file: vendor/ringo/go/.go-version
          cache: false
      # SHA256 says nobody edited core.wasm after it was vendored. Only a
      # rebuild says it is the Go source beside it — and the binary is what the
      # application executes.
      - name: vendor/ringo/core.wasm is what vendor/ringo/go builds to
        run: ./scripts/build-ringo-wasm.sh --check
      - name: /rfcs and /backlog == ringo's, per tab
        env:
          TASKS_DATABASE: ${{ github.workspace }}/tmp/ci-tasks.db
          TASKS_CLI: ${{ github.workspace }}/tasks
        run: pnpm gate:lists
      # Proves the gate still detects a difference, rather than passing because
      # it stopped looking.
      - name: The list gate still goes red on a difference
        env:
          TASKS_DATABASE: ${{ github.workspace }}/tmp/ci-tasks.db
          TASKS_CLI: ${{ github.workspace }}/tasks
        run: pnpm gate:lists --self-test
      # And that the row-VALUE half still detects one: membership and order are
      # untouched here, only a row's inherited-priority mark changes.
      - name: The list gate still goes red on a changed row value
        env:
          TASKS_DATABASE: ${{ github.workspace }}/tmp/ci-tasks.db
          TASKS_CLI: ${{ github.workspace }}/tasks
        run: pnpm gate:lists --self-test=values
      - name: The markdown helper == ringo's core/markdown.go, over every RFC and story
        env:
          TASKS_DIR: ${{ github.workspace }}/tasks
        run: pnpm gate:markdown
      - name: A one-character change to the helper turns the markdown gate red
        env:
          TASKS_DIR: ${{ github.workspace }}/tasks
        run: pnpm gate:markdown --self-test

  # THE PARITY-GRAPH GATE, over a fixture. /graphs/parity/data is a port of
  # ringo's /spawnloop/parity, and the live comparison needs a running ringo
  # and the multi-gigabyte stats.db, so it only ever ran on the box. Here both
  # sides read one small stats database the gate writes: ringo's is ringo's own
  # handler, compiled from vendor/ringo/db/parity.go at the pin, and trailmap's
  # goes through the Postgres projection as production does — hence the
  # service. Reverting either defect the live gate found (gap columns looked up
  # by table; one select list for every table) turns this red.
  parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailmap_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      HUB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/ringo/go/.go-version
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec trails-tsc-views build --views app/views
      # No `--database hub` — see the note on the test job.
      - name: Prepare the hub schema
        env:
          HUB_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_hub_test
        run: pnpm db:migrate
      - name: /graphs/parity/data == ringo's /spawnloop/parity, point for point
        run: pnpm gate:parity --fixture
      - name: The parity gate still goes red on a changed point
        run: pnpm gate:parity --fixture --self-test

  # Ported from trails' Preflight job. CLAUDE.md forbids Claude attribution in
  # commits and PR bodies here exactly as it does there, and trailmap is a
  # separate repo with its own merge button — so the rule was unenforced until
  # this job existed. Kept a job of its own rather than folded into `typecheck`:
  # a checkout-and-install failure there must not decide whether the scan ran.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # pull-requests: read for the `gh api repos/.../pulls` calls. Declaring
      # `permissions:` zeroes every unlisted scope, so contents must be listed
      # explicitly even though it is part of the default token.
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      # Single source of truth for the forbidden-attribution markers, shared by
      # the PR-body and commit-message scans below so the two can't drift apart.
      # Matched case-insensitively (grep -iE).
      ATTRIBUTION_RE: 'generated with \[?claude code|co-authored-by:[[:space:]]*claude|noreply@anthropic\.com|🤖 generated with'
    steps:
      - uses: actions/checkout@v4

      # Scoped to deanmarano-authored PRs: the project forbids Claude
      # attribution in *his* PR descriptions and commits (see CLAUDE.md
      # "No `Co-Authored-By` trailer, no 'Generated with Claude Code' line").
      # Other contributors are unaffected; push has no PR body.
      - name: Forbid Claude attribution in PR body
        # !cancelled() so a prior step's failure can't suppress this guard.
        if: >-
          ${{ !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'deanmarano' }}
        run: |
          set -euo pipefail
          # Fetch the *live* body rather than reading the event payload. The
          # PR triggers don't include `edited`, so a body edit won't re-fire
          # CI — but a manual job re-run hits the API fresh and will see the
          # fix. Reading the payload would replay the stale original body and
          # leave the check permanently red.
          body=$(scripts/ci/gh-api-retry.sh "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""')
          if grep -qiE "$ATTRIBUTION_RE" <<<"$body"; then
            echo "::error::PR body contains Claude attribution. Remove 'Generated with Claude Code' / 'Co-Authored-By: Claude' / Anthropic attribution lines (see CLAUDE.md), then re-run this job."
            exit 1
          fi
          echo "No forbidden Claude attribution found in PR body."

      - name: Forbid Claude attribution in commit messages
        # !cancelled() so a prior step's failure can't suppress this guard.
        if: >-
          ${{ !cancelled() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'deanmarano' }}
        run: |
          set -euo pipefail
          # See the body guard above: retry transient API failures so a 5xx
          # can't masquerade as an attribution hit.
          # Scan every commit message on the PR, not just the PR body. The body
          # check above misses `Co-authored-by:` trailers that live in commits —
          # and GitHub's squash-merge auto-aggregates those branch-commit
          # trailers into the merge commit on `main`, which is exactly how a
          # Claude attribution reached main past the body check.
          #
          # The pulls/{n}/commits endpoint caps at 250 commits even with
          # --paginate, so a >250-commit PR would leave its tail unscanned. Fail
          # closed in that case rather than passing on a partial scan — this repo
          # squashes and PRs are small; if 250 commits ever happens, squash or
          # rebase before re-running.
          count=$(scripts/ci/gh-api-retry.sh "repos/$REPO/pulls/$PR_NUMBER" --jq '.commits')
          if [ "$count" -gt 250 ]; then
            echo "::error::PR has $count commits, exceeding the 250-commit API scan cap. Squash or rebase the branch so commit messages can be fully scanned, then re-run this job."
            exit 1
          fi
          messages=$(scripts/ci/gh-api-retry.sh --paginate "repos/$REPO/pulls/$PR_NUMBER/commits" --jq '.[].commit.message')
          if grep -qiE "$ATTRIBUTION_RE" <<<"$messages"; then
            echo "::error::A commit message contains Claude attribution. Remove 'Generated with Claude Code' / 'Co-Authored-By: Claude' / Anthropic attribution lines from your commits (see CLAUDE.md) — note that squash-merge folds commit trailers into main — then re-run this job."
            exit 1
          fi
          echo "No forbidden Claude attribution found in commit messages."

  # The Rails twin of the app (rails/, ../CLAUDE.md "`rails/` is the same site
  # in Rails"). Its own Postgres, for the reason the `test` job has one: the
  # hub tests skip without HUB_TEST_DATABASE_URL, and a silent skip is how
  # tests rot.
  rails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trailmap_rails_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      HUB_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/trailmap_rails_hub_test
    defaults:
      run:
        working-directory: rails
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          working-directory: rails
          bundler-cache: true
      - run: bin/rails db:prepare
      - run: bin/rails test
      # twin-diff reads this twin through Prism, and this is the job with
      # Ruby 3.3: its end-to-end test skips in the unit job, which has none.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # `shell: bash` is `bash -eo pipefail`, so a failing vitest fails the step
      # through the pipe; the grep then requires the PASS marker, so a skipped
      # or missing end-to-end case fails it too.
      - name: twin-diff end to end
        working-directory: .
        shell: bash
        # CI=true can turn vitest's colour on without a TTY; the grep needs the
        # plain `✓ ` marker.
        env:
          NO_COLOR: "1"
        run: |
          pnpm exec vitest run test/scripts/twin-diff.test.ts --reporter=verbose | tee twin-diff-test.log
          grep -q "✓ .*runs end to end over rails/ and app/" twin-diff-test.log
