# The stories more than one test file works with, all under the `trailmap`
# RFC fixture. A file that needs another story creates it inline, and every
# assertion that counts or lists stories counts these three with it. Each
# satisfies `Story.semanticErrors`, so a test of a clean backlog stays clean.
#
# story_deps, story_paths and events get no fixture file, on purpose: no two
# files share a row of them, and each row exists to make one test's point (a
# dep that blocks, a path one lookup matches, an event one verb counts). A
# suite-wide row would only add a term to those assertions and prove nothing.

