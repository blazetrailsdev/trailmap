# Solid Queue's processes, as `solid_queue:install` writes this file
# (solid_queue v1.1.3). Read by the `worker` process (Procfile, bin/jobs), the same file as ../../config/queue.yml.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: "*"
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
